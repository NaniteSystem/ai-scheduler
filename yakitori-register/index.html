<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>焼き鳥 レジ</title>
<style>
  :root {
    --bg: #fbf7f1; --card: #fff; --ink: #2b2118; --muted: #8a7b6c;
    --line: #eadfd2; --accent: #c2410c; --accent-ink: #fff;
    --ok: #15803d; --bad: #b91c1c; --soft: #fff1e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .cashbox { font-weight: 700; font-size: 18px; background: var(--soft); padding: 6px 12px; border-radius: 10px; }
  .langs button { border: 1px solid var(--line); background: var(--card); padding: 6px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px; }
  .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px;
    padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .prod { border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .prod.has { border-color: var(--accent); background: var(--soft); }
  .prod .name { font-size: 22px; font-weight: 700; }
  .prod .sub { color: var(--muted); font-size: 13px; min-height: 18px; }
  .qty { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
  .qty .fl { min-width: 44px; font-weight: 700; font-size: 15px; text-align: left; }
  .qty button { width: 52px; height: 52px; font-size: 26px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--ink); color: #fff; }
  .qty button.minus { background: #d6cbbf; color: var(--ink); }
  .qty span { font-size: 26px; font-weight: 700; min-width: 36px; }
  .rule { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px;
    padding-top: 12px; border-top: 1px dashed var(--line); }
  .total .big { font-size: 34px; font-weight: 800; color: var(--accent); }
  .breakdown { color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { padding: 14px 16px; border-radius: 12px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .small { padding: 8px 12px; font-size: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
  .small.ok { background: var(--ok); color: #fff; }
  .small.bad { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .small.plain { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .order { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: center; }
  .order .no { font-size: 24px; font-weight: 800; min-width: 52px; }
  .order .items { flex: 1; }
  .order .meta { color: var(--muted); font-size: 13px; }
  .order .btns { display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--muted); font-style: italic; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    cursor: pointer; font-size: 15px; font-weight: 600; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.cancelled td { color: var(--muted); text-decoration: line-through; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 800; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .row input { font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; width: 130px; }
  .scroll { max-height: 60vh; overflow: auto; }
  .bk { border: none; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .bk.ok { background: #dcfce7; color: var(--ok); }
  .bk.warn { background: #fee2e2; color: var(--bad); }
  .backup { margin-top: 20px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; }
  .backup h2 { margin-bottom: 6px; }
  .backup .info { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <div class="cashbox"><span data-t="sales"></span>: <span id="cashTop"></span></div>
  <button class="bk" id="backupChip"></button>
  <div class="langs">
    <button data-lang="ja">日本語</button>
    <button data-lang="ru">Русский</button>
    <button data-lang="en">English</button>
  </div>
</header>

<main>
  <!-- New order -->
  <section>
    <h2 data-t="newOrder"></h2>
    <div class="products" id="products"></div>
    <p class="rule" data-t="rule"></p>

    <div class="total">
      <div>
        <div data-t="total"></div>
        <div class="breakdown" id="breakdown"></div>
      </div>
      <div class="big" id="total">¥0</div>
    </div>


    <div class="actions">
      <button class="btn ghost" id="clearBtn" data-t="clear"></button>
      <button class="btn primary" id="payBtn" data-t="pay"></button>
    </div>
  </section>

  <!-- Orders / history / cash -->
  <section>
    <div class="tabs">
      <button data-tab="active"><span data-t="active"></span> (<span id="activeCount">0</span>)</button>
      <button data-tab="history" data-t="history"></button>
      <button data-tab="cash" data-t="sales"></button>
    </div>
    <div id="tab-active" class="scroll"></div>
    <div id="tab-history" class="scroll"></div>
    <div id="tab-cash"></div>
  </section>
</main>

<script>
const PRODUCTS = [
  { id: 'momo',   ja: 'もも',     ru: 'Момо (бедро)',       en: 'Momo (thigh)' },
  { id: 'kawa',   ja: 'かわ',     ru: 'Кава (кожа)',        en: 'Kawa (skin)' },
  { id: 'negi',   ja: 'ねぎ',     ru: 'Нэги (с луком)',     en: 'Negi (with leek)' },
  { id: 'bonjiri',ja: 'ボンジリ', ru: 'Бондзири (хвостик)', en: 'Bonjiri (tail)' },
];
const FLAVORS = ['shio', 'tare', 'none'];
const UNIT = 100, SET_SIZE = 4, SET_PRICE = 300;

const I18N = {
  ja: {
    title: '焼き鳥 レジ', newOrder: '新しい注文', shio: '塩', tare: 'タレ', none: 'なし',
    rule: '1本100円・どれでも4本で300円（塩・タレ・なし同じ値段）', total: '合計', clear: 'クリア', pay: '会計する',
    active: '受付中', history: '履歴', sales: '売上', done: '渡した', cancel: '取消',
    noActive: '受付中の注文はありません', noHistory: 'まだ履歴はありません',
    set: '4本セット', single: '単品', pcs: '本', time: '時刻', order: '注文', items: '内容', sum: '金額',
    status: '状態', stDone: '完了', stCancelled: '取消', stActive: '受付中',
    confirmCancel: '注文 #{n}（¥{s}）を取り消しますか？',
    orders: '注文数', sticks: '販売本数', product: '商品', exportCsv: 'CSV保存',
    confirmReset: '本日を締めますか？注文は「過去の日」に移ります（削除されません）。バックアップも保存されます。', byItem: '商品別',
    resetDay: '一日を締める', backup: 'バックアップ', downloadBackup: 'バックアップを保存', restore: 'ファイルから復元',
    autoFile: 'ファイルへ自動保存を設定', autoResume: '自動保存を再開', autoOn: '自動保存中', autoFail: '自動保存に失敗',
    lastBackup: '最終バックアップ', never: 'まだありません', unsaved: '未バックアップの変更',
    confirmRestore: '現在のデータをファイルの内容で置き換えますか？（現在のデータは先に保存されます）',
    restoreBad: 'このファイルは読み込めません', restored: '復元しました', persistOk: 'ブラウザの永続保存: 有効',
    persistNo: 'ブラウザの永続保存: 未許可', pastDays: '過去の日', date: '日付',
    backupHint: 'データはこの端末のブラウザ内（2か所）に自動保存されます。念のため定期的に「バックアップを保存」してください。',
  },
  ru: {
    title: 'Якитори — касса', newOrder: 'Новый заказ', shio: 'Соль', tare: 'Тарэ', none: 'Без',
    rule: '1 шт. — 100 ¥ · любые 4 шт. — 300 ¥ (соль / тарэ / без — цена одна)', total: 'Итого', clear: 'Очистить', pay: 'Оплачено',
    active: 'Заказы', history: 'История', sales: 'Выручка', done: 'Выдан', cancel: 'Отмена',
    noActive: 'Нет текущих заказов', noHistory: 'История пока пуста',
    set: 'набор из 4', single: 'поштучно', pcs: 'шт.', time: 'Время', order: 'Заказ', items: 'Состав', sum: 'Сумма',
    status: 'Статус', stDone: 'Выдан', stCancelled: 'Отменён', stActive: 'Готовится',
    confirmCancel: 'Отменить заказ #{n} (¥{s})?',
    orders: 'Заказов', sticks: 'Продано шт.', product: 'Товар', exportCsv: 'Сохранить CSV',
    confirmReset: 'Закрыть день? Заказы перейдут в «Прошлые дни» (не удаляются), и автоматически скачается бэкап.', byItem: 'По видам',
    resetDay: 'Закрыть день', backup: 'Резервная копия', downloadBackup: 'Скачать бэкап', restore: 'Восстановить из файла',
    autoFile: 'Настроить автосохранение в файл', autoResume: 'Возобновить автосохранение', autoOn: 'Автосохранение в файл', autoFail: 'Ошибка автосохранения',
    lastBackup: 'Последний бэкап', never: 'ещё не было', unsaved: 'Изменений без бэкапа',
    confirmRestore: 'Заменить текущие данные данными из файла? (текущие данные сначала будут скачаны)',
    restoreBad: 'Не удалось прочитать файл', restored: 'Данные восстановлены', persistOk: 'Постоянное хранилище браузера: включено',
    persistNo: 'Постоянное хранилище браузера: не разрешено', pastDays: 'Прошлые дни', date: 'Дата',
    backupHint: 'Данные автоматически хранятся в браузере этого устройства (в двух местах). Для надёжности регулярно нажимайте «Скачать бэкап».',
  },
  en: {
    title: 'Yakitori Register', newOrder: 'New order', shio: 'Salt', tare: 'Tare', none: 'Plain',
    rule: '¥100 each · any 4 for ¥300 (salt, tare or plain, same price)', total: 'Total', clear: 'Clear', pay: 'Paid',
    active: 'Orders', history: 'History', sales: 'Sales', done: 'Handed', cancel: 'Cancel',
    noActive: 'No open orders', noHistory: 'No history yet',
    set: 'set of 4', single: 'single', pcs: 'pcs', time: 'Time', order: 'Order', items: 'Items', sum: 'Amount',
    status: 'Status', stDone: 'Done', stCancelled: 'Cancelled', stActive: 'Open',
    confirmCancel: 'Cancel order #{n} (¥{s})?',
    orders: 'Orders', sticks: 'Sticks sold', product: 'Item', exportCsv: 'Export CSV',
    confirmReset: 'Close the day? Orders move to "Previous days" (nothing is deleted) and a backup is downloaded.', byItem: 'By item',
    resetDay: 'Close day', backup: 'Backup', downloadBackup: 'Download backup', restore: 'Restore from file',
    autoFile: 'Set up auto-save to file', autoResume: 'Resume auto-save', autoOn: 'Auto-saving to file', autoFail: 'Auto-save failed',
    lastBackup: 'Last backup', never: 'none yet', unsaved: 'Changes not backed up',
    confirmRestore: 'Replace current data with the file contents? (current data is downloaded first)',
    restoreBad: 'Could not read this file', restored: 'Data restored', persistOk: 'Persistent browser storage: on',
    persistNo: 'Persistent browser storage: not granted', pastDays: 'Previous days', date: 'Date',
    backupHint: 'Data is saved automatically in this browser (in two places). To be safe, press "Download backup" regularly.',
  },
};

// ---------- state (saved in this browser, works offline) ----------
// order.items is keyed "productId:flavor", e.g. { "momo:shio": 2, "kawa:tare": 1 }
// Data is kept in three places: localStorage, an IndexedDB mirror, and (optionally) a
// backup file on disk that is rewritten after every change. Closed days go to state.archive,
// nothing is ever deleted. state.rev counts data changes, state.backupRev = rev at last backup.
const KEY = 'yakitori-register-v2';
const BACKUP_REMIND_AFTER = 10;
let state = load();
let cart = {};
let tab = 'active';
let fileHandle = null, fileStatus = 'none'; // none | needsPermission | on | error
let persisted = false;

function normalize(s) {
  return Object.assign({ lang: 'ja', nextNo: 1, orders: [], archive: [], rev: 0, backupRev: 0,
    lastBackupAt: 0, savedAt: 0 }, s || {});
}
function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); }
  catch { return normalize(); }
}
function save(dataChanged = true) {
  if (dataChanged) state.rev++;
  state.savedAt = Date.now();
  const json = JSON.stringify(state);
  try { localStorage.setItem(KEY, json); } catch {}
  idbSet('state', json);
  if (dataChanged && fileStatus === 'on') writeBackupFile();
}

// --- IndexedDB mirror ---
const idb = new Promise(res => {
  try {
    const r = indexedDB.open('yakitori-register', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  } catch { res(null); }
});
async function idbGet(k) {
  const db = await idb; if (!db) return undefined;
  return new Promise(res => {
    const r = db.transaction('kv').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result); r.onerror = () => res(undefined);
  });
}
async function idbSet(k, v) {
  const db = await idb; if (!db) return;
  try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch {}
}

// --- backup file / download ---
const backupJson = () => JSON.stringify({ app: 'yakitori-register', exportedAt: Date.now(), state }, null, 1);
function markBackedUp() {
  state.backupRev = state.rev; state.lastBackupAt = Date.now(); save(false);
}
function downloadBackup() {
  markBackedUp();
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `yakitori-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  download(new Blob([backupJson()], { type: 'application/json' }), name);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let writing = Promise.resolve();
function writeBackupFile() {
  writing = writing.then(async () => {
    try {
      const w = await fileHandle.createWritable();
      await w.write(backupJson()); await w.close();
      state.backupRev = state.rev; state.lastBackupAt = Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
      idbSet('state', JSON.stringify(state));
      fileStatus = 'on';
    } catch { fileStatus = 'error'; }
    renderBackupChip(); if (tab === 'cash') renderSales();
  });
}
async function setupAutoFile() {
  try {
    fileHandle = await window.showSaveFilePicker({ suggestedName: 'yakitori-backup.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
    idbSet('fileHandle', fileHandle);
    fileStatus = 'on'; writeBackupFile();
  } catch {}
}
async function resumeAutoFile() {
  try {
    if (await fileHandle.requestPermission({ mode: 'readwrite' }) === 'granted') { fileStatus = 'on'; writeBackupFile(); }
  } catch { fileStatus = 'error'; }
}
function restoreFromFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch {}
    const s = data && data.app === 'yakitori-register' && data.state;
    if (!s || !Array.isArray(s.orders)) { alert(t('restoreBad')); return; }
    if (!confirm(t('confirmRestore'))) return;
    downloadBackup(); // keep a copy of what we are about to replace
    state = normalize(s); state.lang = state.lang || 'ja';
    save(); markBackedUp(); alert(t('restored')); render();
  };
  r.readAsText(file);
}

// On start: take the IndexedDB copy if it is newer than localStorage (e.g. localStorage was cleared),
// reconnect the auto-save file, and ask the browser not to evict our storage.
(async () => {
  const mirrored = await idbGet('state');
  if (mirrored) {
    try {
      const m = normalize(JSON.parse(mirrored));
      if (m.savedAt > state.savedAt) { state = m; save(false); }
    } catch {}
  } else save(false);
  fileHandle = await idbGet('fileHandle') || null;
  if (fileHandle) {
    try { fileStatus = await fileHandle.queryPermission({ mode: 'readwrite' }) === 'granted' ? 'on' : 'needsPermission'; }
    catch { fileStatus = 'needsPermission'; }
    if (fileStatus === 'on' && state.backupRev !== state.rev) writeBackupFile();
  }
  try { persisted = await navigator.storage.persisted() || await navigator.storage.persist(); } catch {}
  render();
})();

const t = k => I18N[state.lang][k] ?? k;
const yen = n => '¥' + n.toLocaleString('ja-JP');
const pname = id => PRODUCTS.find(p => p.id === id)[state.lang];
const count = items => Object.values(items).reduce((a, b) => a + b, 0);
function price(n) {
  const sets = Math.floor(n / SET_SIZE), rest = n % SET_SIZE;
  return { sets, rest, total: sets * SET_PRICE + rest * UNIT };
}
const itemsText = items => Object.entries(items).filter(([, q]) => q > 0).map(([key, q]) => {
  const [id, fl] = key.split(':');
  return state.lang === 'ja' ? `${pname(id)}（${t(fl)}）×${q}` : `${pname(id)} · ${t(fl)} ×${q}`;
}).join(', ');
const timeText = ts => new Date(ts).toLocaleTimeString(state.lang === 'en' ? 'en-GB' : state.lang,
  { hour: '2-digit', minute: '2-digit' });
const validOrders = () => state.orders.filter(o => o.status !== 'cancelled');
const totalSales = () => validOrders().reduce((a, o) => a + o.total, 0);

// ---------- rendering ----------
function render() {
  document.documentElement.lang = state.lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['active', 'history', 'cash'].forEach(x => document.getElementById('tab-' + x).hidden = x !== tab);
  document.getElementById('cashTop').textContent = yen(totalSales());
  renderProducts(); renderTotal(); renderActive(); renderHistory(); renderSales(); renderBackupChip();
}

function renderBackupChip() {
  const chip = document.getElementById('backupChip');
  const pending = state.rev - state.backupRev;
  const warn = fileStatus === 'error' || fileStatus === 'needsPermission' ||
    (fileStatus !== 'on' && (pending >= BACKUP_REMIND_AFTER || (!state.lastBackupAt && pending > 0)));
  chip.className = 'bk ' + (warn ? 'warn' : 'ok');
  chip.textContent = warn ? `⚠ ${t('backup')}${pending ? ' (' + pending + ')' : ''}`
    : `💾 ${state.lastBackupAt ? timeText(state.lastBackupAt) : t('backup')}`;
}

function renderProducts() {
  document.getElementById('products').innerHTML = PRODUCTS.map(p => {
    const has = FLAVORS.some(f => cart[`${p.id}:${f}`]);
    const sub = state.lang === 'ja' ? '' : p[state.lang];
    return `<div class="prod ${has ? 'has' : ''}">
      <div class="name">${p.ja}</div><div class="sub">${sub}</div>
      ${FLAVORS.map(f => {
        const key = `${p.id}:${f}`;
        return `<div class="qty">
          <span class="fl">${t(f)}</span>
          <button class="minus" data-dec="${key}" aria-label="-">−</button>
          <span>${cart[key] || 0}</span>
          <button data-inc="${key}" aria-label="+">+</button>
        </div>`;
      }).join('')}</div>`;
  }).join('');
}

function renderTotal() {
  const n = count(cart), p = price(n);
  document.getElementById('total').textContent = yen(p.total);
  const parts = [];
  if (p.sets) parts.push(`${t('set')} ×${p.sets} = ${yen(p.sets * SET_PRICE)}`);
  if (p.rest) parts.push(`${t('single')} ×${p.rest} = ${yen(p.rest * UNIT)}`);
  document.getElementById('breakdown').textContent = n ? `${n} ${t('pcs')} · ${parts.join(' + ')}` : '';
  document.getElementById('payBtn').disabled = !n;
  document.getElementById('clearBtn').disabled = !n;
}

function renderActive() {
  const list = state.orders.filter(o => o.status === 'active');
  document.getElementById('activeCount').textContent = list.length;
  document.getElementById('tab-active').innerHTML = list.length ? list.map(o => `
    <div class="order">
      <div class="no">#${o.no}</div>
      <div class="items">${itemsText(o.items)}<div class="meta">${timeText(o.time)} · ${count(o.items)} ${t('pcs')} · ${yen(o.total)}</div></div>
      <div class="btns">
        <button class="small ok" data-done="${o.no}">✓ ${t('done')}</button>
        <button class="small bad" data-cancel="${o.no}">${t('cancel')}</button>
      </div>
    </div>`).join('') : `<p class="empty">${t('noActive')}</p>`;
}

function renderHistory() {
  const rows = [...state.orders].sort((a, b) => b.time - a.time);
  document.getElementById('tab-history').innerHTML = rows.length ? `<table>
    <tr><th>${t('time')}</th><th>${t('order')}</th><th>${t('items')}</th><th>${t('status')}</th><th class="num">${t('sum')}</th></tr>
    ${rows.map(o => `<tr class="${o.status === 'cancelled' ? 'cancelled' : ''}">
      <td>${timeText(o.time)}</td><td>#${o.no}</td><td>${itemsText(o.items)}</td>
      <td>${t(o.status === 'done' ? 'stDone' : o.status === 'cancelled' ? 'stCancelled' : 'stActive')}</td>
      <td class="num">${yen(o.total)}</td></tr>`).join('')}</table>`
    : `<p class="empty">${t('noHistory')}</p>`;
}

function renderSales() {
  const valid = validOrders();
  const per = {};
  valid.forEach(o => Object.entries(o.items).forEach(([k, q]) => per[k] = (per[k] || 0) + q));
  const sticks = Object.values(per).reduce((a, b) => a + b, 0);
  document.getElementById('tab-cash').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">${t('sales')}</div><div class="v">${yen(totalSales())}</div></div>
      <div class="stat"><div class="k">${t('orders')}</div><div class="v">${valid.length}</div></div>
      <div class="stat"><div class="k">${t('sticks')}</div><div class="v">${sticks}</div></div>
    </div>
    <h2>${t('byItem')}</h2>
    <table>
      <tr><th>${t('product')}</th>${FLAVORS.map(f => `<th class="num">${t(f)}</th>`).join('')}<th class="num">${t('total')}</th></tr>
      ${PRODUCTS.map(p => {
        const q = FLAVORS.map(f => per[`${p.id}:${f}`] || 0);
        return `<tr><td>${p.ja}${state.lang === 'ja' ? '' : ' — ' + p[state.lang]}</td>
          ${q.map(x => `<td class="num">${x}</td>`).join('')}<td class="num"><b>${q.reduce((a, b) => a + b, 0)}</b></td></tr>`;
      }).join('')}
    </table>
    <div class="row" style="margin-top:20px">
      <button class="small plain" id="exportCsv">${t('exportCsv')}</button>
      <button class="small bad" id="resetDay">${t('resetDay')}</button></div>
    ${renderBackupBox()}
    ${renderArchive()}`;
}

function renderBackupBox() {
  const pending = state.rev - state.backupRev;
  const canFile = 'showSaveFilePicker' in window;
  const fileLine = fileStatus === 'on' ? `✅ ${t('autoOn')}${fileHandle ? ': ' + fileHandle.name : ''}`
    : fileStatus === 'error' ? `⚠ ${t('autoFail')}` : '';
  return `<div class="backup">
    <h2>💾 ${t('backup')}</h2>
    <div class="info">${t('backupHint')}</div>
    <div class="info" style="margin-top:6px">${t('lastBackup')}: ${state.lastBackupAt
      ? new Date(state.lastBackupAt).toLocaleString(state.lang === 'en' ? 'en-GB' : state.lang) : t('never')}
      · ${t('unsaved')}: ${pending}<br>${persisted ? t('persistOk') : t('persistNo')}${fileLine ? '<br>' + fileLine : ''}</div>
    <div class="row">
      <button class="small ok" id="downloadBackup">${t('downloadBackup')}</button>
      <button class="small plain" id="restoreBtn">${t('restore')}</button>
      ${canFile && fileStatus === 'needsPermission' ? `<button class="small bad" id="resumeAuto">${t('autoResume')}</button>` : ''}
      ${canFile && fileStatus !== 'needsPermission' ? `<button class="small plain" id="setupAuto">${t('autoFile')}</button>` : ''}
    </div>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>`;
}

function renderArchive() {
  if (!state.archive.length) return '';
  const rows = [...state.archive].reverse().map(d => {
    const v = d.orders.filter(o => o.status !== 'cancelled');
    return `<tr><td>${new Date(d.closedAt).toLocaleDateString(state.lang === 'en' ? 'en-GB' : state.lang)}</td>
      <td class="num">${v.length}</td><td class="num">${v.reduce((a, o) => a + count(o.items), 0)}</td>
      <td class="num">${yen(v.reduce((a, o) => a + o.total, 0))}</td></tr>`;
  }).join('');
  return `<h2 style="margin-top:20px">${t('pastDays')}</h2><table>
    <tr><th>${t('date')}</th><th class="num">${t('orders')}</th><th class="num">${t('sticks')}</th><th class="num">${t('sales')}</th></tr>
    ${rows}</table>`;
}

// ---------- actions ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.lang) { state.lang = d.lang; save(false); }
  else if (d.tab) tab = d.tab;
  else if (d.inc) cart[d.inc] = (cart[d.inc] || 0) + 1;
  else if (d.dec) cart[d.dec] = Math.max(0, (cart[d.dec] || 0) - 1);
  else if (d.done) { state.orders.find(o => o.no == d.done).status = 'done'; save(); }
  else if (d.cancel) {
    const o = state.orders.find(o => o.no == d.cancel);
    if (!confirm(t('confirmCancel').replace('{n}', o.no).replace('{s}', o.total))) return;
    o.status = 'cancelled'; save();
  }
  else if (b.id === 'clearBtn') cart = {};
  else if (b.id === 'payBtn') {
    const n = count(cart); if (!n) return;
    const items = {}; Object.entries(cart).forEach(([k, q]) => { if (q) items[k] = q; });
    state.orders.push({ no: state.nextNo++, items, total: price(n).total, time: Date.now(), status: 'active' });
    save(); cart = {}; tab = 'active';
  }
  else if (b.id === 'exportCsv') exportCsv();
  else if (b.id === 'resetDay') {
    if (!confirm(t('confirmReset'))) return;
    if (state.orders.length) state.archive.push({ closedAt: Date.now(), orders: state.orders });
    state.orders = []; state.nextNo = 1; save();
    downloadBackup();
  }
  else if (b.id === 'backupChip') tab = 'cash';
  else if (b.id === 'downloadBackup') downloadBackup();
  else if (b.id === 'restoreBtn') { document.getElementById('restoreFile').click(); return; }
  else if (b.id === 'setupAuto') { setupAutoFile(); return; }
  else if (b.id === 'resumeAuto') { resumeAutoFile(); return; }
  else return;
  render();
});

document.addEventListener('change', e => {
  if (e.target.id === 'restoreFile' && e.target.files[0]) restoreFromFile(e.target.files[0]);
});

function exportCsv() {
  const cols = PRODUCTS.flatMap(p => FLAVORS.map(f => `${p.id}:${f}`));
  const lines = [['time', 'order', ...cols, 'status', 'amount'].join(',')];
  state.orders.forEach(o => lines.push([new Date(o.time).toLocaleString('ja-JP'), o.no,
    ...cols.map(c => o.items[c] || 0), o.status, o.total].join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' });
  download(blob, `yakitori-${new Date().toISOString().slice(0, 10)}.csv`);
}

render();
</script>
</body>
</html>
