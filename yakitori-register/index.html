<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>焼き鳥 レジ</title>
<style>
  :root {
    --bg: #fbf7f1; --card: #fff; --ink: #2b2118; --muted: #8a7b6c;
    --line: #eadfd2; --accent: #c2410c; --accent-ink: #fff;
    --ok: #15803d; --bad: #b91c1c; --soft: #fff1e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .cashbox { font-weight: 700; font-size: 18px; background: var(--soft); padding: 6px 12px; border-radius: 10px; }
  .langs button { border: 1px solid var(--line); background: var(--card); padding: 6px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px; }
  .langs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px;
    padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .prod { border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .prod.has { border-color: var(--accent); background: var(--soft); }
  .prod .name { font-size: 22px; font-weight: 700; }
  .prod .sub { color: var(--muted); font-size: 13px; min-height: 18px; }
  .qty { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
  .qty .fl { min-width: 44px; font-weight: 700; font-size: 15px; text-align: left; }
  .qty button { width: 52px; height: 52px; font-size: 26px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--ink); color: #fff; }
  .qty button.minus { background: #d6cbbf; color: var(--ink); }
  .qty span { font-size: 26px; font-weight: 700; min-width: 36px; }
  .rule { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px;
    padding-top: 12px; border-top: 1px dashed var(--line); }
  .total .big { font-size: 34px; font-weight: 800; color: var(--accent); }
  .breakdown { color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { padding: 14px 16px; border-radius: 12px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .small { padding: 8px 12px; font-size: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
  .small.ok { background: var(--ok); color: #fff; }
  .small.bad { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .small.plain { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .order { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: center; }
  .order .no { font-size: 24px; font-weight: 800; min-width: 52px; }
  .order .items { flex: 1; }
  .order .meta { color: var(--muted); font-size: 13px; }
  .order .btns { display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--muted); font-style: italic; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    cursor: pointer; font-size: 15px; font-weight: 600; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.cancelled td { color: var(--muted); text-decoration: line-through; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 10px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 800; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .row input { font-size: 16px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; width: 130px; }
  .scroll { max-height: 60vh; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <div class="cashbox"><span data-t="sales"></span>: <span id="cashTop"></span></div>
  <div class="langs">
    <button data-lang="ja">日本語</button>
    <button data-lang="ru">Русский</button>
    <button data-lang="en">English</button>
  </div>
</header>

<main>
  <!-- New order -->
  <section>
    <h2 data-t="newOrder"></h2>
    <div class="products" id="products"></div>
    <p class="rule" data-t="rule"></p>

    <div class="total">
      <div>
        <div data-t="total"></div>
        <div class="breakdown" id="breakdown"></div>
      </div>
      <div class="big" id="total">¥0</div>
    </div>


    <div class="actions">
      <button class="btn ghost" id="clearBtn" data-t="clear"></button>
      <button class="btn primary" id="payBtn" data-t="pay"></button>
    </div>
  </section>

  <!-- Orders / history / cash -->
  <section>
    <div class="tabs">
      <button data-tab="active"><span data-t="active"></span> (<span id="activeCount">0</span>)</button>
      <button data-tab="history" data-t="history"></button>
      <button data-tab="cash" data-t="sales"></button>
    </div>
    <div id="tab-active" class="scroll"></div>
    <div id="tab-history" class="scroll"></div>
    <div id="tab-cash"></div>
  </section>
</main>

<script>
const PRODUCTS = [
  { id: 'momo',   ja: 'もも',     ru: 'Момо (бедро)',       en: 'Momo (thigh)' },
  { id: 'kawa',   ja: 'かわ',     ru: 'Кава (кожа)',        en: 'Kawa (skin)' },
  { id: 'negi',   ja: 'ねぎ',     ru: 'Нэги (с луком)',     en: 'Negi (with leek)' },
  { id: 'bonjiri',ja: 'ボンジリ', ru: 'Бондзири (хвостик)', en: 'Bonjiri (tail)' },
];
const FLAVORS = ['shio', 'tare'];
const UNIT = 100, SET_SIZE = 4, SET_PRICE = 300;

const I18N = {
  ja: {
    title: '焼き鳥 レジ', newOrder: '新しい注文', shio: '塩', tare: 'タレ',
    rule: '1本100円・どれでも4本で300円（塩・タレ同じ値段）', total: '合計', clear: 'クリア', pay: '会計する',
    active: '受付中', history: '履歴', sales: '売上', done: '渡した', cancel: '取消',
    noActive: '受付中の注文はありません', noHistory: 'まだ履歴はありません',
    set: '4本セット', single: '単品', pcs: '本', time: '時刻', order: '注文', items: '内容', sum: '金額',
    status: '状態', stDone: '完了', stCancelled: '取消', stActive: '受付中',
    confirmCancel: '注文 #{n}（¥{s}）を取り消しますか？',
    orders: '注文数', sticks: '販売本数', product: '商品', exportCsv: 'CSV保存', resetDay: '一日をリセット',
    confirmReset: '全ての注文・履歴を削除します。よろしいですか？', byItem: '商品別',
  },
  ru: {
    title: 'Якитори — касса', newOrder: 'Новый заказ', shio: 'Соль', tare: 'Тарэ',
    rule: '1 шт. — 100 ¥ · любые 4 шт. — 300 ¥ (соль/тарэ — цена одна)', total: 'Итого', clear: 'Очистить', pay: 'Оплачено',
    active: 'Заказы', history: 'История', sales: 'Выручка', done: 'Выдан', cancel: 'Отмена',
    noActive: 'Нет текущих заказов', noHistory: 'История пока пуста',
    set: 'набор из 4', single: 'поштучно', pcs: 'шт.', time: 'Время', order: 'Заказ', items: 'Состав', sum: 'Сумма',
    status: 'Статус', stDone: 'Выдан', stCancelled: 'Отменён', stActive: 'Готовится',
    confirmCancel: 'Отменить заказ #{n} (¥{s})?',
    orders: 'Заказов', sticks: 'Продано шт.', product: 'Товар', exportCsv: 'Сохранить CSV', resetDay: 'Сбросить день',
    confirmReset: 'Удалить все заказы и историю? Это нельзя отменить.', byItem: 'По видам',
  },
  en: {
    title: 'Yakitori Register', newOrder: 'New order', shio: 'Salt', tare: 'Tare',
    rule: '¥100 each · any 4 for ¥300 (salt or tare, same price)', total: 'Total', clear: 'Clear', pay: 'Paid',
    active: 'Orders', history: 'History', sales: 'Sales', done: 'Handed', cancel: 'Cancel',
    noActive: 'No open orders', noHistory: 'No history yet',
    set: 'set of 4', single: 'single', pcs: 'pcs', time: 'Time', order: 'Order', items: 'Items', sum: 'Amount',
    status: 'Status', stDone: 'Done', stCancelled: 'Cancelled', stActive: 'Open',
    confirmCancel: 'Cancel order #{n} (¥{s})?',
    orders: 'Orders', sticks: 'Sticks sold', product: 'Item', exportCsv: 'Export CSV', resetDay: 'Reset day',
    confirmReset: 'Delete all orders and history? This cannot be undone.', byItem: 'By item',
  },
};

// ---------- state (saved in this browser, works offline) ----------
// order.items is keyed "productId:flavor", e.g. { "momo:shio": 2, "kawa:tare": 1 }
const KEY = 'yakitori-register-v2';
let state = load();
let cart = {};
let tab = 'active';

function load() {
  const def = { lang: 'ja', nextNo: 1, orders: [] };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return def; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

const t = k => I18N[state.lang][k] ?? k;
const yen = n => '¥' + n.toLocaleString('ja-JP');
const pname = id => PRODUCTS.find(p => p.id === id)[state.lang];
const count = items => Object.values(items).reduce((a, b) => a + b, 0);
function price(n) {
  const sets = Math.floor(n / SET_SIZE), rest = n % SET_SIZE;
  return { sets, rest, total: sets * SET_PRICE + rest * UNIT };
}
const itemsText = items => Object.entries(items).filter(([, q]) => q > 0).map(([key, q]) => {
  const [id, fl] = key.split(':');
  return state.lang === 'ja' ? `${pname(id)}（${t(fl)}）×${q}` : `${pname(id)} · ${t(fl)} ×${q}`;
}).join(', ');
const timeText = ts => new Date(ts).toLocaleTimeString(state.lang === 'en' ? 'en-GB' : state.lang,
  { hour: '2-digit', minute: '2-digit' });
const validOrders = () => state.orders.filter(o => o.status !== 'cancelled');
const totalSales = () => validOrders().reduce((a, o) => a + o.total, 0);

// ---------- rendering ----------
function render() {
  document.documentElement.lang = state.lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['active', 'history', 'cash'].forEach(x => document.getElementById('tab-' + x).hidden = x !== tab);
  document.getElementById('cashTop').textContent = yen(totalSales());
  renderProducts(); renderTotal(); renderActive(); renderHistory(); renderSales();
}

function renderProducts() {
  document.getElementById('products').innerHTML = PRODUCTS.map(p => {
    const has = FLAVORS.some(f => cart[`${p.id}:${f}`]);
    const sub = state.lang === 'ja' ? '' : p[state.lang];
    return `<div class="prod ${has ? 'has' : ''}">
      <div class="name">${p.ja}</div><div class="sub">${sub}</div>
      ${FLAVORS.map(f => {
        const key = `${p.id}:${f}`;
        return `<div class="qty">
          <span class="fl">${t(f)}</span>
          <button class="minus" data-dec="${key}" aria-label="-">−</button>
          <span>${cart[key] || 0}</span>
          <button data-inc="${key}" aria-label="+">+</button>
        </div>`;
      }).join('')}</div>`;
  }).join('');
}

function renderTotal() {
  const n = count(cart), p = price(n);
  document.getElementById('total').textContent = yen(p.total);
  const parts = [];
  if (p.sets) parts.push(`${t('set')} ×${p.sets} = ${yen(p.sets * SET_PRICE)}`);
  if (p.rest) parts.push(`${t('single')} ×${p.rest} = ${yen(p.rest * UNIT)}`);
  document.getElementById('breakdown').textContent = n ? `${n} ${t('pcs')} · ${parts.join(' + ')}` : '';
  document.getElementById('payBtn').disabled = !n;
  document.getElementById('clearBtn').disabled = !n;
}

function renderActive() {
  const list = state.orders.filter(o => o.status === 'active');
  document.getElementById('activeCount').textContent = list.length;
  document.getElementById('tab-active').innerHTML = list.length ? list.map(o => `
    <div class="order">
      <div class="no">#${o.no}</div>
      <div class="items">${itemsText(o.items)}<div class="meta">${timeText(o.time)} · ${count(o.items)} ${t('pcs')} · ${yen(o.total)}</div></div>
      <div class="btns">
        <button class="small ok" data-done="${o.no}">✓ ${t('done')}</button>
        <button class="small bad" data-cancel="${o.no}">${t('cancel')}</button>
      </div>
    </div>`).join('') : `<p class="empty">${t('noActive')}</p>`;
}

function renderHistory() {
  const rows = [...state.orders].sort((a, b) => b.time - a.time);
  document.getElementById('tab-history').innerHTML = rows.length ? `<table>
    <tr><th>${t('time')}</th><th>${t('order')}</th><th>${t('items')}</th><th>${t('status')}</th><th class="num">${t('sum')}</th></tr>
    ${rows.map(o => `<tr class="${o.status === 'cancelled' ? 'cancelled' : ''}">
      <td>${timeText(o.time)}</td><td>#${o.no}</td><td>${itemsText(o.items)}</td>
      <td>${t(o.status === 'done' ? 'stDone' : o.status === 'cancelled' ? 'stCancelled' : 'stActive')}</td>
      <td class="num">${yen(o.total)}</td></tr>`).join('')}</table>`
    : `<p class="empty">${t('noHistory')}</p>`;
}

function renderSales() {
  const valid = validOrders();
  const per = {};
  valid.forEach(o => Object.entries(o.items).forEach(([k, q]) => per[k] = (per[k] || 0) + q));
  const sticks = Object.values(per).reduce((a, b) => a + b, 0);
  document.getElementById('tab-cash').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">${t('sales')}</div><div class="v">${yen(totalSales())}</div></div>
      <div class="stat"><div class="k">${t('orders')}</div><div class="v">${valid.length}</div></div>
      <div class="stat"><div class="k">${t('sticks')}</div><div class="v">${sticks}</div></div>
    </div>
    <h2>${t('byItem')}</h2>
    <table>
      <tr><th>${t('product')}</th>${FLAVORS.map(f => `<th class="num">${t(f)}</th>`).join('')}<th class="num">${t('total')}</th></tr>
      ${PRODUCTS.map(p => {
        const q = FLAVORS.map(f => per[`${p.id}:${f}`] || 0);
        return `<tr><td>${p.ja}${state.lang === 'ja' ? '' : ' — ' + p[state.lang]}</td>
          ${q.map(x => `<td class="num">${x}</td>`).join('')}<td class="num"><b>${q[0] + q[1]}</b></td></tr>`;
      }).join('')}
    </table>
    <div class="row" style="margin-top:20px">
      <button class="small plain" id="exportCsv">${t('exportCsv')}</button>
      <button class="small bad" id="resetDay">${t('resetDay')}</button></div>`;
}

// ---------- actions ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.lang) { state.lang = d.lang; save(); }
  else if (d.tab) tab = d.tab;
  else if (d.inc) cart[d.inc] = (cart[d.inc] || 0) + 1;
  else if (d.dec) cart[d.dec] = Math.max(0, (cart[d.dec] || 0) - 1);
  else if (d.done) { state.orders.find(o => o.no == d.done).status = 'done'; save(); }
  else if (d.cancel) {
    const o = state.orders.find(o => o.no == d.cancel);
    if (!confirm(t('confirmCancel').replace('{n}', o.no).replace('{s}', o.total))) return;
    o.status = 'cancelled'; save();
  }
  else if (b.id === 'clearBtn') cart = {};
  else if (b.id === 'payBtn') {
    const n = count(cart); if (!n) return;
    const items = {}; Object.entries(cart).forEach(([k, q]) => { if (q) items[k] = q; });
    state.orders.push({ no: state.nextNo++, items, total: price(n).total, time: Date.now(), status: 'active' });
    save(); cart = {}; tab = 'active';
  }
  else if (b.id === 'exportCsv') exportCsv();
  else if (b.id === 'resetDay') {
    if (!confirm(t('confirmReset'))) return;
    state = { lang: state.lang, nextNo: 1, orders: [] }; save();
  }
  else return;
  render();
});

function exportCsv() {
  const cols = PRODUCTS.flatMap(p => FLAVORS.map(f => `${p.id}:${f}`));
  const lines = [['time', 'order', ...cols, 'status', 'amount'].join(',')];
  state.orders.forEach(o => lines.push([new Date(o.time).toLocaleString('ja-JP'), o.no,
    ...cols.map(c => o.items[c] || 0), o.status, o.total].join(',')));
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `yakitori-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
